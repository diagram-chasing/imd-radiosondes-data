name: Update dataset

on:
  schedule:
    # 04:00 UTC is 09:30 IST, by which the 00 UTC report has filled in.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Synchronize dependencies
        run: uv sync

      - name: Update the dataset
        run: uv run python run.py update

      - name: Commit the revised data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update the flight record through $(date -u +%Y-%m-%d)"
          git push
